services:
  siteflow:
    build: .
    image: ghcr.io/mcocdaa/siteflow:latest
    container_name: siteflow
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?please set ADMIN_PASSWORD}"
      SITE_TITLE: "${SITE_TITLE:-My Works}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-100}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    volumes:
      - ./data:/data
