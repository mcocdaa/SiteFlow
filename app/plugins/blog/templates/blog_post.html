<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ post.title }}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="blog-body">
  {% import "icons.html" as icons %}
  <div class="blog-actions">
    <a class="btn ghost" href="/projects/{{ project.slug }}/">{{ icons.icon("arrow-left") }}文章列表</a>
  </div>
  <main class="blog">
    <article class="post">
      <header class="post-head">
        <h1>{{ post.title }}</h1>
        <p class="post-meta">
          {% if post.date %}<span>{{ post.date }}</span>{% endif %}
          {% for tag in post.tags %}<span class="chip">{{ tag }}</span>{% endfor %}
        </p>
      </header>
      <div class="post-body">{{ body_html | safe }}</div>
    </article>
  </main>
</body>
</html>
