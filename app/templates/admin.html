<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理 - {{ site_title }}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <meta name="csrf" content="{{ csrf }}">
</head>
<body>
  {% import "icons.html" as icons %}
  {% import "_admin_rows.html" as rows %}
  <header class="site-header">
    <div class="wrap row-between">
      <a class="brand" href="/">{{ icons.icon("arrow-left") }}{{ site_title }}</a>
      <button class="btn ghost" data-action="logout">{{ icons.icon("log-out") }}退出登录</button>
    </div>
  </header>
  <main class="wrap">
    <section class="dropzone" id="dropzone">
      <span class="dropzone-icon">{{ icons.icon("upload", 28) }}</span>
      <p><strong>拖拽 HTML 或 ZIP 到这里</strong></p>
      <p class="muted">或点击选择文件 · 也可以在下方添加外链 / 新建应用</p>
      <input type="file" id="file-input" accept=".html,.htm,.zip" hidden>
    </section>
    <section class="link-row">
      <input type="url" id="link-url" placeholder="https://example.com 作品链接">
      <button class="btn primary" data-action="add-link">{{ icons.icon("plus") }}添加链接</button>
    </section>
    <section class="app-create">
      <button class="btn" data-action="create-space">{{ icons.icon("layers") }}新建空间</button>
      <button class="btn" data-action="create-resume">{{ icons.icon("file-text") }}新建简历</button>
      <button class="btn ghost" data-action="upload-app">{{ icons.icon("archive") }}上传静态站点</button>
    </section>
    {{ rows.rows(projects) }}
  </main>
  <script src="/static/js/admin.js" defer></script>
</body>
</html>
