version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: "cron"
      cronjob: "0 4 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "cron"
      cronjob: "0 4 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'chore(ci)'
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: "cron"
      cronjob: "0 4 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: python
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    commit-message:
      prefix: 'chore(docker)'
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: "cron"
      cronjob: "0 4 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(docker)'
