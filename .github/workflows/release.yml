name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 tag（如 v2.4.0）
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Verify version matches git tag
        run: |
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          EXPECTED="${RAW_TAG#v}"
          ACTUAL=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "Tag version: $EXPECTED | pyproject.toml: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Check lockfile
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Repo consistency check
        run: uv run --extra dev python scripts/check_repo.py
      - name: Run tests
        run: uv run --extra dev pytest -q
      - name: Lint
        run: uv run --extra dev ruff check .
      - name: Format check
        run: uv run --extra dev ruff format --check .
      - name: Type check
        run: uv run --extra dev mypy app tests scripts/check_repo.py
      - name: JS syntax
        run: |
          for script in app/static/js/*.js; do
            node --check "$script"
          done
      - name: Validate compose config
        run: ADMIN_PASSWORD=ci-secret docker compose config -q

  publish:
    name: Publish image to GHCR
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Verify changelog section for release tag
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "${RAW_TAG}" == v* && "${RAW_TAG}" != *-* ]]; then
            VERSION="${RAW_TAG#v}"
            python3 - "${VERSION}" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          content = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if not re.search(rf"^## \[{re.escape(version)}\](?:\s|$)", content, re.MULTILINE):
              sys.exit(f"CHANGELOG.md missing section header: ## [{version}]")
          print(f"CHANGELOG.md verified for {version}")
          PY
          fi
      - name: Resolve lowercase image name
        id: image
        run: |
          IMAGE="$(printf 'ghcr.io/%s/siteflow' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${IMAGE}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=semver,pattern=v{{version}},value=${{ inputs.tag }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
